    <path d="M0 0 C -42 -48, -54 -76, -54 -100 C -54 -132, -30 -156, 0 -156 C 30 -156, 54 -132, 54 -100 C 54 -76, 42 -48, 0 0 Z" fill="#3b2464"/>
